<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>99 Bottles of Beer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container py-5">
        <h1 class="mb-4 text-left">99 Bottles of Beer</h1>

        <div class="text-left">
            <button class="btn btn-primary" onclick="printLyrics()">Print Lyrics</button>
        </div>

        <div class="text-left" id="output"></div>

        <script>
            function printLyrics() {
                const out = document.getElementById("output");

                out.innerHTML = "";

                for (let i = 99; i >= 1; i--) {
                    let line = "";

                    let currentWord = "bottles";
                    if (i === 1) {
                        currentWord = "bottle";
                    }

                    let nextNumber = i - 1;

                    if (i > 1) {
                        line = i + " " + currentWord + " of beer on the wall, " +
                            i + " " + currentWord + " of beer<br>";

                        if (nextNumber === 0) {
                            line = line +
                                "Take one down and pass it around, " +
                                "no more bottles of beer on the wall";
                        } else {
                            let nextWord = "bottles";
                            if (nextNumber === 1) {
                                nextWord = "bottle";
                            }

                            line = line +
                                "Take one down and pass it around, " +
                                nextNumber + " " + nextWord + " of beer on the wall";
                        }

                    } else {
                        line =
                            "1 bottle of beer on the wall, 1 bottle of beer<br>" +
                            "Take one down and pass it around, no more bottles of beer on the wall";
                    }
                    out.innerHTML += "<br>" + line + "<br>";
                }
                out.innerHTML += "<br>" +
                    "No more bottles of beer on the wall, no more bottles of beer<br>" +
                    "Go to the store and buy some more, 99 bottles of beer on the wall";
            }
        </script>
</body>

</html>
